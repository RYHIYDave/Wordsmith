# THE WINDOWS APP, built on one of GitHub's Linux machines from the Godot game (godot/). His pick, 28 Nov 2026, told his copy
# on his computer (run from the project's own files) had never played a sound while the game itself does: “Yes, make it
# (Recommended)”, a Windows app to replace that copy: one download, everything packed in (its sounds too), double-clicked to
# play. Godot 4.7.2 exports godot/export_presets.cfg's "Windows Desktop": Wordsmith.exe and its Wordsmith.pck side by side,
# zipped as Wordsmith-Windows, kept on the run's page to download.
# Runs with every update of the game on main, when this file changes on the working branch, or by hand.
name: Windows build

on:
  push:
    branches: [main, claude/sharp-lamport-ey7q0l]
    paths: ['godot/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  windows:
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      contains(toJSON(github.event.commits), '.github/workflows/windows.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/lib/android || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: godot

      - name: Godot 4.7.2 and its Windows template
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot-bin
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$T"
          rm templates.tpz godot.zip
          ls -la "$T"

      - name: The game's data brought in
        run: |
          ./godot-bin --headless --path godot --import > import.log 2>&1 || true
          tail -5 import.log
          df -h /

      - name: The Windows app
        run: |
          mkdir -p build/Wordsmith
          set +e
          ./godot-bin --headless --path godot --export-release "Windows Desktop" "$PWD/build/Wordsmith/Wordsmith.exe" > export.log 2>&1
          code=$?
          set -e
          grep -nE "ERROR|error:|FAILED|failed" export.log | head -40 || true
          tail -20 export.log
          ls -la build/Wordsmith
          test -f build/Wordsmith/Wordsmith.exe && test -f build/Wordsmith/Wordsmith.pck
          exit $code

      - name: How to play it
        run: |
          printf 'WORDSMITH\r\n\r\nKeep Wordsmith.exe and Wordsmith.pck in the same folder, and double-click Wordsmith.exe to play.\r\nIf Windows says it protected your PC, click "More info", then "Run anyway" (the app is not signed yet).\r\nYour saved game stays on your computer when you replace these files with a newer download.\r\n' > build/Wordsmith/HOW_TO_PLAY.txt
          du -h build/Wordsmith/*

      - uses: actions/upload-artifact@v4
        with:
          name: Wordsmith-Windows
          path: build/Wordsmith
          retention-days: 30
          compression-level: 6
