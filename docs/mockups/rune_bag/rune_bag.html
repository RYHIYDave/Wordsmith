:root {

#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; background: var(--panel); }
#search { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; }

ing, melded. Two blows in the time of one.", "front": "Strikes twice with no pause between, and what it leaves works in a third less time.", "behind": "Repeats itself almost at once instead of a moment later.", "monster": "Attacks twice, the second blow coming with no warning.", "attr": "dex", "group": "MELDS", "city": false, "s": 124, "f": "Staccato", "b": "of Staccato"}, {"id": "ripple", "name": "Ripple", "kind": "meld", "color": "#4a9a8a", "of": ["twin", "vast"], "about": "Twin and Vast, melded. The second blow spreads out from the first.", "front": "Strikes twice; the second blow lands as a wider ring around the first, catching what the first missed.", "behind": "Repeats itself a moment later, over a much bigger area.", "monster": "Attacks twice; its second attack reaches much wider.", "attr": "dex", "group": "MELDS", "city": false, "s": 125, "f": "Rippling", "b": "of Ripples"}, {"id": "bloodbloom", "name": "Bloodbloom", "kind": "meld", "color": "#bf1d1d", "of": ["leech", "volatile"], "about": "Leech and Volatile, melded. Every blast feeds you.", "front": "Enemies it kills explode, and each blast heals you for every enemy it catches.", "behind": "Leaves a rune; enemies its blast kills drop life orbs.", "monster": "Heals when it hits you; explodes when it dies, and its blast heals the monsters near it.", "attr": "str", "group": "MELDS", "city": false, "s": 126, "f": "Bloodbloom", "b": "of the Bloodbloom"}, {"id": "lancet", "name": "Lancet", "kind": "meld", "color": "#ffc0c8", "of": ["leech", "precise"], "about": "Leech and Precise, melded. A surgeon's cut that feeds you.", "front": "More damage, a smaller area; heals you for every enemy hit, and a critical hit heals three times as much.", "behind": "Marks an enemy: your certain critical on it also heals you for a share of the hit.", "monster": "Heals when it hits you; its hits find the gaps in your armour. Its critical hits heal it three times as much.", "attr": "str", "group": "MELDS", "city": false, "s": 127, "f": "Lancet", "b": "of the Lancet"}, {"id": "feedingfrenzy", "name": "Feeding Frenzy", "kind": "meld", "color": "#f25a5a", "of": ["leech", "frenzied"], "about": "Leech and Frenzied, melded. The faster you go, the more you drink.", "front": "Each use makes the next faster, up to five times, and the higher the frenzy, the more each hit heals you.", "behind": "Kills keep the frenzy going, and at a full frenzy enemies it kills drop life orbs.", "monster": "Speeds up as it is hurt; heals when it hits you, more the faster it goes.", "attr": "str", "group": "MELDS", "city": false, "s": 128, "f": "Feeding", "b": "of the Feeding Frenzy"}, {"id": "carapace", "name": "Carapace", "kind": "meld", "color": "#b86a74", "of": ["leech", "guarding"], "about": "Leech and Guarding, melded. Healing you can't use hardens into a shell.", "front": "Heals you for every enemy hit; healing beyond full life becomes a shield.", "behind": "Leaves a ward circle; inside it you slowly heal.", "monster": "Heals when it hits you; carries a shield that soaks damage, and its healing tops the shield up.", "attr": "str", "group": "MELDS", "city": false, "s": 129, "f": "Carapace", "b": "of the Carapace"}, {"id": "transfusion", "name": "Transfusion", "kind": "meld", "color": "#b25b55", "of": ["leech", "lasting"], "about": "Leech and Lasting, melded. The life keeps flowing.", "front": "Heals you for every enemy hit, and the healing keeps coming in over the next few seconds, half again as much in all.", "behind": "Enemies it kills drop life orbs that last much longer and heal over a few seconds.", "monster": "Heals when it hits you, and keeps healing for a few seconds after.", "attr": "str", "group": "MELDS", "city": false, "s": 130, "f": "Transfusing", "b": "of Transfusion"}, {"id": "lifeline", "name": "Lifeline", "kind": "meld", "color": "#f59f87", "of": ["leech", "fleeting"], "about": "Leech and Fleeting, melded. The heal comes fastest when you need it most.", "front": "Heals you for every enemy hit; below er the blast.", "attr": "int", "group": "MELDS", "city": false, "s": 134, "f": "Mayhem", "b": "of Mayhem"}, {"id": "minefield", "name": "Minefield", "kind": "meld", "color": "#6878c8", "of": ["volatile", "guarding"], "about": "Volatile and Guarding, melded. Holding ground that bites back.", "front": "Each use gives you a brief shield; enemies it kills while your shield holds explode.", "behind": "Leaves a ward circle; enemies that die inside it explode.", "monster": "Carries a shield that soaks damage; explodes when it dies, twice as big if its shield was still up.", "attr": "int", "group": "MELDS", "city": false, "s": 135, "f": "Minefield", "b": "of the Minefield"}, {"id": "timebomb", "name": "Timebomb", "kind": "meld", "color": "#a070c0", "of": ["volatile", "lasting"], "about": "Volatile and Lasting, melded. The longer the wait, the bigger the bang.", "front": "Enemies it kills explode a second later, twice as big.", "behind": "Leaves a rune that waits twice as long before it goes off, and goes off twice as big.", "monster": "Explodes when it dies, a second later and twice as hard: get clear.", "attr": "int", "group": "MELDS", "city": false, "s": 136, "f": "Timebomb", "b": "of the Timebomb"}, {"id": "hairtrigger", "name": "Hair Trigger", "kind": "meld", "color": "#e4a0f4", "of": ["volatile", "fleeting"], "about": "Volatile and Fleeting, melded. The slightest touch sets it off.", "front": "An enemy brought below a tenth of its life explodes at once (never a boss).", "behind": "Leaves a rune that goes off the instant an enemy touches it.", "monster": "Explodes when it dies; brought very low, it bursts at once.", "attr": "int", "group": "MELDS", "city": false, "s": 137, "f": "Hair-Trigger", "b": "of the Hair Trigger"}, {"id": "blastwave", "name": "Blastwave", "kind": "meld", "color": "#7c4ca0", "of": ["volatile", "vast"], "about": "Volatile and Vast, melded. Blasts that clear the room.", "front": "A much bigger area; enemies it kills explode, and each blast throws the enemies it doesn't kill out to its edge.", "behind": "Leaves a rune whose blast covers a much bigger area.", "monster": "Its attacks reach wider; explodes when it dies, and the blast throws you back.", "attr": "int", "group": "MELDS", "city": false, "s": 138, "f": "Blastwave", "b": "of the Blastwave"}, {"id": "rapier", "name": "Rapier", "kind": "meld", "color": "#ffb8a0", "of": ["precise", "frenzied"], "about": "Precise and Frenzied, melded. Quicker, and quicker to find the gap.", "front": "More damage, a smaller area; each use makes the next faster, and the higher the frenzy, the more often it lands a critical hit.", "behind": "Kills keep the frenzy going, and a critical kill adds two steps to it.", "monster": "Speeds up as it is hurt; its hits find the gaps in your armour, and the more hurt it is, the more often it lands critical hits.", "attr": "dex", "group": "MELDS", "city": false, "s": 139, "f": "Rapier", "b": "of the Rapier"}, {"id": "riposte", "name": "Riposte", "kind": "meld", "color": "#b0e0c0", "of": ["precise", "guarding"], "about": "Precise and Guarding, melded. Block, then strike back true.", "front": "Each use gives you a brief shield; whatever strikes the shield, your next hit on it is a certain critical.", "behind": "Leaves a ward circle; your hits on enemies inside it are critical more often.", "monster": "Carries a shield that soaks damage; its hits find the gaps in your armour. When you strike its shield, its next blow on you is critical.", "attr": "dex", "group": "MELDS", "city": false, "s": 140, "f": "Riposte", "b": "of the Riposte"}, {"id": "vendetta", "name": "Vendetta", "kind": "meld", "color": "#d8b4a8", "of": ["precise", "lasting"], "about": "Precise and Lasting, melded. It won't forget who it marked.", "front": "More damage, a smaller area; a critical hit marks the enemy, and every hit on it after is more likely to be critical until it dies.", "behind": "Marks an enemy until it dies: every third hit on it is a certain critical.", "monst .", "front": "A much bigger area, a little less damage; for a few seconds after, enemies that walk into where it struck are hit again, weaker.", "behind": "Each hit's splash lingers on the ground for a moment, hitting enemies that step into it.", "monster": "Its attacks reach wider, and the ground where they land keeps hurting you for a few seconds.", "attr": "int", "group": "MELDS", "city": false, "s": 152, "f": "Aftermath", "b": "of the Aftermath"}, {"id": "whipcrack", "name": "Whipcrack", "kind": "meld", "color": "#e4b890", "of": ["fleeting", "vast"], "about": "Fleeting and Vast, melded. Wide, and with no warning.", "front": "A much bigger area, and the whole of it lands at once with no wind-up.", "behind": "Each hit's splash goes off at once and reaches farther.", "monster": "Its attacks reach wider and come with less warning.", "attr": "dex", "group": "MELDS", "city": false, "s": 153, "f": "Whipcrack", "b": "of the Whipcrack"}, {"id": "maw", "name": "Maw", "kind": "meld", "color": "#c42c3c", "of": ["pulling", "power"], "about": "Pulling and Power, melded. Drag them in, then crush them together.", "front": "More damage and a bigger hit that drags the enemies it hits toward where it struck; those that meet there crash together and hurt each other.", "behind": "Leaves a vortex that keeps drawing enemies in; when it ends it collapses in a blast, harder for each enemy inside.", "monster": "Hits harder and has more life; its blows drag you toward it, and its next blow after a drag hits harder.", "attr": "int", "group": "MELDS", "city": true, "s": 154, "f": "Maw", "b": "of the Maw"}, {"id": "sump", "name": "Sump", "kind": "meld", "color": "#6e8c4a", "of": ["pulling", "poison"], "about": "Pulling and Poison, melded. Everything drains to one place.", "front": "A weaker hit that poisons and drags what it hits toward where it struck; each enemy pulled in takes one more dose for each poisoned enemy beside it, up to three.", "behind": "Leaves a vortex of poison that draws e
